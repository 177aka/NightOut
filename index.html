<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NightOut</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#050505">
</head>
<body>
    
    <!-- ÉCRAN D'ACCUEIL -->
    <div id="home-screen" class="screen active">
        <h1 class="logo">Night<span>Out</span></h1>
        <p class="subtitle-home">L'application de soirée ultime</p>
        
        <div class="panel">
            <div class="panel-header">
                <h3>Joueurs (<span id="player-count">0</span>)</h3>
            </div>
            <div class="input-group">
                <input type="text" id="new-player" placeholder="Prénom..." autocomplete="off">
               <select id="new-player-gender" class="minimal-select gender-select">
                    <option value="M">Garçon</option>
                    <option value="F">Fille</option>
                </select>
                <button id="add-player-btn" class="icon-btn">+</button>
            </div>
            <div id="player-list" class="tags-container"></div>
        </div>

        <div class="panel settings-panel">
            <h3>Paramètres</h3>
            
            <div class="setting-row">
                <label>Mode de jeu</label>
                <select id="level-select" class="minimal-select">
                    <option value="soft">Chill (Amis)</option>
                    <option value="fun">Fun (Délires)</option>
                    <option value="flirt">Flirt (Rapprochements)</option>
                    <option value="hardcore">Hardcore (No Limit)</option>
                </select>
            </div>

            <div class="setting-row">
                <label>No Orientation Limit <br><small style="color:var(--text-muted); font-size:0.75rem;">Si désactivé: H/F en Flirt/Hardcore</small></label>
                <label class="switch">
                    <input type="checkbox" id="setting-orientation">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <label>Vibrations (Haptique)</label>
                <label class="switch">
                    <input type="checkbox" id="setting-haptic" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <button id="start-game-btn" class="btn-primary">Commencer la soirée</button>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="game-screen" class="screen">
        <header class="game-header">
            <button id="back-btn" class="text-btn">Quitter</button>
            <div id="current-theme-indicator" class="theme-badge">Chill</div>
            <button id="scoreboard-btn" class="text-btn">Scores</button>
        </header>

        <div id="game-board">
            <div id="orbit-container"></div>
            <button id="play-btn" class="center-btn">GO</button>
        </div>

        <!-- Pop-up Modale -->
        <div id="action-modal" class="modal-overlay hidden">
            <div class="modal-content panel">
                
                <div id="choice-step" class="hidden">
                    <h2 class="turn-title">À toi <span id="active-player-name" class="highlight-text"></span></h2>
                    <p class="modal-subtitle">Fais ton choix</p>
                    <div class="choice-grid">
                        <button id="btn-action" class="choice-btn">Action</button>
                        <button id="btn-truth" class="choice-btn">Vérité</button>
                    </div>
                </div>

                <div id="challenge-step" class="hidden">
                    <div class="challenge-type-badge" id="challenge-type-badge">ACTION</div>
                    <p id="challenge-text" class="challenge-text">Texte du défi...</p>
                    <div class="action-buttons">
                        <button id="btn-success" class="btn-success">C'est fait</button>
                        <button id="btn-fail" class="btn-secondary">Je passe (Gage)</button>
                    </div>
                </div>

                <div id="alert-step" class="hidden">
                    <div class="challenge-type-badge alert-badge" id="alert-badge">GAGE</div>
                    <p id="alert-text" class="challenge-text">Texte de l'alerte...</p>
                    <button id="btn-continue" class="btn-primary">Continuer</button>
                </div>
                
            </div>
        </div>

        <div id="score-modal" class="modal-overlay hidden">
            <div class="modal-content panel">
                <h2>Classement</h2>
                <div id="score-list" class="score-list"></div>
                <button id="close-score-btn" class="btn-primary">Fermer</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
